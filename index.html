
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Happy Birthday Animation</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            height: 100vh;
            overflow: hidden;
            font-family: Arial, sans-serif;
            background: linear-gradient(135deg, #ff9a9e, #fad0c4);
        }

        .container {
            text-align: center;
            padding-top: 130px;
        }

        h1 {
            font-size: 55px;
            color: white;
            text-shadow: 3px 3px 8px #ff4081;
            animation: zoom 1.5s infinite alternate;
        }

        p {
            margin: 20px;
            font-size: 22px;
            color: white;
        }

        .cake {
            font-size: 110px;
            animation: bounce 1s infinite alternate;
        }

        button {
            padding: 15px 35px;
            border: none;
            border-radius: 30px;
            background: #ff4081;
            color: white;
            font-size: 20px;
            cursor: pointer;
            box-shadow: 0 5px 15px #888;
        }

        button:hover {
            transform: scale(1.1);
        }

        /* Balloons */

        .balloon {
            position: absolute;
            font-size: 60px;
            bottom: -100px;
            animation: fly 6s linear infinite;
        }

        .b1 {
            left: 10%;
        }

        .b2 {
            left: 30%;
            animation-delay: 2s;
        }

        .b3 {
            left: 70%;
            animation-delay: 1s;
        }

        .b4 {
            left: 90%;
            animation-delay: 3s;
        }

        /* Title Animation */

        @keyframes zoom {
            from {
                transform: scale(1);
            }

            to {
                transform: scale(1.15);
            }
        }

        /* Cake Animation */

        @keyframes bounce {
            from {
                transform: translateY(0);
            }

            to {
                transform: translateY(-20px);
            }
        }

        /* Balloon Animation */

        @keyframes fly {
            from {
                bottom: -100px;
            }

            to {
                bottom: 110%;
            }
        }

        /* Confetti */

        .confetti {
            position: absolute;
            width: 10px;
            height: 10px;
            top: -10px;
            animation: fall 3s linear forwards;
        }

        @keyframes fall {
            from {
                top: -10px;
                transform: rotate(0deg);
            }

            to {
                top: 100vh;
                transform: rotate(720deg);
            }
        }
    </style>
    <style> 
        h2{
            font-size: 100px;
            font-style: bold;
            font-weight: 100px;
            color: #2f3606;
            font-family: 'Arial', sans-serif;
            animation: pulse 1.5s infinite alternate;
            
        }

        @keyframes pulse {
            from {
                transform: scale(1);
            }

            to {
                transform: scale(1.3);
            }
        }
    </style>
</head>

<body>

    <div class="container">

        <h1 id="title">🎉 Happy Birthday 🎉</h1>

        <p id="message">
            Wishing you a wonderful day filled with happiness! 💖
            <h2>HARINI AKKA</h2>
        </p>    

        <div class="cake">
            🎂
        </div>

        <button onclick="celebrate()">
            🎁 Celebrate
        </button>

    </div>

    <!-- Balloons -->

    <div class="balloon b1">🎈</div>
    <div class="balloon b2">🎈</div>
    <div class="balloon b3">🎈</div>
    <div class="balloon b4">🎈</div>

    <!-- JavaScript -->

    <script>

        function celebrate() {

            document.getElementById("title").innerHTML =
                "🎊 HAPPY BIRTHDAY! 🎊";

            document.getElementById("message").innerHTML =
                "Have an amazing birthday! 🎂💖✨";

            // Create 100 confetti pieces

            for (let i = 0; i < 100; i++) {

                let confetti = document.createElement("div");

                confetti.classList.add("confetti");

                confetti.style.left =
                    Math.random() * 100 + "%";

                confetti.style.backgroundColor =
                    "hsl(" + Math.random() * 360 +
                    ", 100%, 50%)";

                confetti.style.animationDuration =
                    (Math.random() * 2 + 2) + "s";

                document.body.appendChild(confetti);
            }
        }

    </script>

</body>
</html>
